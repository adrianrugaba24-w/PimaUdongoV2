<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pima: sign in</title>
<style>
  :root{
    --ink:#18271D; --muted:#566259; --line:#DDE6DB;
    --g:#26734D; --gd:#174B34; --or:#F0A34B; --red:#B83A2D;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       color:#fff;background:#4C7A3A}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--or);outline-offset:2px}
  .login{position:fixed;inset:0;display:flex;
         padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
         overflow:auto}
  .login>svg{position:absolute;inset:0;width:100%;height:100%}
  .gl{position:relative;margin:auto;width:min(440px,100%);padding:30px 26px;border-radius:26px;color:#fff;
      background:rgba(10,30,18,.42);border:1.5px solid rgba(255,255,255,.55);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;
         text-transform:uppercase;background:rgba(255,255,255,.22);border-radius:999px;
         padding:3px 11px}
  .gl h1{font-size:34px;letter-spacing:-.5px;margin:10px 0 0}
  .gl p{margin:4px 0 18px;font-size:15px}
  .gl small{display:block;margin-top:8px;font-size:13px;opacity:.95}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.16);
       border-radius:16px;padding:4px;margin-bottom:4px}
  .seg button{border:0;border-radius:12px;background:none;color:#fff;font:inherit;
              font-weight:700;min-height:44px;cursor:pointer}
  .seg button[aria-selected=true]{background:#fff;color:#174B34}
  .gl label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
  .gl input{width:100%;height:50px;padding:0 18px;color:#fff;background:rgba(0,0,0,.22);
            border:1.5px solid rgba(255,255,255,.65);border-radius:16px;font:inherit}
  .gl input::placeholder{color:rgba(255,255,255,.8)}
  .pwr{position:relative}
  .pwr input{padding-right:82px}
  .pwr button{position:absolute;right:6px;top:6px;height:38px;border:0;border-radius:12px;
              background:rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:600;
              padding:0 12px;cursor:pointer}
  .problem{margin:10px 0 0;background:#FBE4E0;color:#8E2A1F;border-radius:12px;
           padding:8px 12px;font-size:14px;font-weight:600}
  .go{width:100%;height:52px;margin-top:16px;border:0;border-radius:16px;font:inherit;
      font-weight:700;font-size:17px;color:#0E3B2A;background:linear-gradient(90deg,#B9D62A,#27A05A);
      cursor:pointer}
  .banner{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3)}
  .ft{width:min(440px,100%);margin:14px auto 0;font-size:13px;text-align:center}
  .ft a{color:#fff}
  /* A short window cannot hold the whole panel; tighten it rather than letting
     the top scroll out of reach. */
  @media (max-height:600px){
    .gl{padding:20px 22px}.gl h1{font-size:28px;margin-top:6px}.gl p{margin-bottom:12px}
    .gl label{margin:10px 0 4px}.gl input{height:44px}.go{height:46px;margin-top:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!-- login:begin -->
<main class="login">
  <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FA3B5"/><stop offset=".5" stop-color="#F1C98E"/></linearGradient></defs><rect width="400" height="800" fill="url(#sky)"/><path d="M0 330C80 300 160 340 240 320S360 300 400 320V800H0Z" fill="#4C7A3A"/><path d="M0 420C90 360 190 440 290 390S380 400 400 410V800H0Z" fill="#6EA33A"/><path d="M0 560C110 480 220 600 400 500V800H0Z" fill="#8DC63F"/><path d="M0 680C120 630 260 720 400 650V800H0Z" fill="#5B8F2E"/></svg>
  <div class="gl">
    <span class="badge" id="label"></span>
    <h1 id="title"></h1>
    <p id="lead"></p>
    <small id="body"></small>
    <div class="seg" role="tablist" id="tabs">
      <button type="button" role="tab" id="tab-farmer" aria-selected="true"></button>
      <button type="button" role="tab" id="tab-researcher" aria-selected="false"></button>
    </div>
    <form id="signin" novalidate autocomplete="off">
      <label for="username" id="username-label"></label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="password" id="password-label"></label>
      <div class="pwr">
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="button" id="show-password" aria-label="Show password"></button>
      </div>
      <p class="problem" id="problem" role="alert" hidden></p>
      <button class="go" type="submit" id="go"></button>
    </form>
    <small id="hint"></small>
    <small id="note"></small>
    <small class="banner" id="banner">Not validated on field sensors or Ugandan farms.</small>
  </div>
</main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var L = null, role = "farmer";

  // One row per account type, so a missing key shows up as an empty field here
  // rather than as a sentence invented in this file.
  function copyFor(r){
    if (r === "researcher") {
      return {label: L.researcher_label, user: L.researcher_username,
              ph: L.researcher_placeholder, hint: L.researcher_hint,
              action: L.researcher_action, href: L.researcher_href};
    }
    return {label: L.farmer_label, user: L.farmer_username,
            ph: L.farmer_placeholder, hint: L.farmer_hint,
            action: L.farmer_action, href: L.farmer_href};
  }

  function choose(r){
    role = r;
    $("tab-farmer").setAttribute("aria-selected", String(r === "farmer"));
    $("tab-researcher").setAttribute("aria-selected", String(r === "researcher"));
    var c = copyFor(r);
    $("username-label").textContent = c.user;
    $("username").placeholder = c.ph;
    $("hint").textContent = c.hint;
    $("go").textContent = c.action;
    $("problem").hidden = true;
  }

  function paint(){
    $("label").textContent = L.label;
    $("title").textContent = L.title;
    $("lead").textContent = L.lead;
    $("body").textContent = L.body;
    $("tabs").setAttribute("aria-label", L.role_label);
    $("tab-farmer").textContent = L.farmer_label;
    $("tab-researcher").textContent = L.researcher_label;
    $("password-label").textContent = L.password_label;
    $("show-password").textContent = L.show;
    $("note").textContent = L.note;
    choose(role);
  }

  fetch("/api/login").then(function(res){ return res.json(); }).then(function(j){
    L = j.login;
    paint();
  }).catch(function(){
    // The gate is served by the same process as these words, so a failure here
    // means the whole demo is down, not just this page.  Nothing is invented to
    // fill the gap.
  });

  $("tab-farmer").addEventListener("click", function(){ if (L) { choose("farmer"); } });
  $("tab-researcher").addEventListener("click", function(){ if (L) { choose("researcher"); } });

  $("show-password").addEventListener("click", function(){
    var q = $("password"), masked = q.type === "password";
    q.type = masked ? "text" : "password";
    this.textContent = masked ? L.hide : L.show;
    this.setAttribute("aria-label", (masked ? L.hide : L.show) + " " + L.password_label.toLowerCase());
  });

  function refuse(text){
    var box = $("problem");
    box.textContent = text;
    box.hidden = false;
  }

  // The form never submits.  Both fields have to be filled so that pressing the
  // button is a deliberate act, but neither is checked: the chosen tab decides
  // which view opens.  The password is cleared as the page leaves, and no request
  // carries what was typed.
  $("signin").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (!L) { return; }
    var u = $("username").value.trim(), q = $("password").value;
    if (!u && !q) { refuse(L.err_both); $("username").focus(); return; }
    if (!u) { refuse(L.err_user); $("username").focus(); return; }
    if (!q) { refuse(L.err_pass); $("password").focus(); return; }
    $("password").value = "";
    window.location.assign(copyFor(role).href);
  });
})();
</script>
<noscript>
  <p class="ft">This page needs scripts to fill in its words. The two views do not:
  <a href="/farmer">the farmer view</a>, <a href="/researcher">the researcher view</a>.</p>
</noscript>
<!-- login:end -->
</body>
</html>
